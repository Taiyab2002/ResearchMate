
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ResearchMate</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-page">
        <section class="login-card">

            <div class="brand-icon">R</div>

            <h1>ResearchMate</h1>
            <p class="subtitle">Start your research journey.</p>

            <h2>Create an account</h2>
            <p class="description">
                Join ResearchMate to organize your academic research.
            </p>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="registerEmail" class="form-label">
                        Email Address
                    </label>
                    <input
                        type="email"
                        class="form-control"
                        id="registerEmail"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="university" class="form-label">
                        University
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="university"
                        placeholder="Enter your university"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label">
                        Department
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="department"
                        placeholder="e.g. Computer Science and Engineering"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="registerPassword" class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn login-btn w-100">
                    Create Account
                </button>

            </form>

            <p class="register-text">
                Already have an account?
                <a href="index.html">Sign in</a>
            </p>

            <p class="footer-text">
                AI-assisted research. Organized your way.
            </p>

        </section>
    </main>

    <script src="script.js"></script>
    <script src="theme.js"></script>
</body>
</html>
